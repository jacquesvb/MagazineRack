[package]
name = "magazine-rack"
version = "1.1.0"
description = "A personal catalog for online magazines and PDFs"
authors = ["Magazine Rack"]
edition = "2021"

[lib]
name = "magazine_rack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
